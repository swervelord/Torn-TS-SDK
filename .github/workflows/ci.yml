name: SDK checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Full gate (PARITY_SPEC P9.3): typecheck, tests incl. shared conformance, generator drift checks, build.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck:tsc
  node-consumer:
    # PARITY_SPEC P9.5: the packed tarball installs into a fresh Node project, runs, and typechecks with default tsc settings.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun tools/pack-smoke.ts --runtime node,tsc
  deno-consumer:
    # PARITY_SPEC P9.5: the same tarball and smoke script under Deno (npm install into a fresh project, deno run).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun tools/pack-smoke.ts --runtime deno,bun
